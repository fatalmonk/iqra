name: Iqra contract tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run public site and Worker contract tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
